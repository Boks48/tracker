<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balance">
<title>Balance Tracker</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #0f0f12;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }

  .balance-label {
    color: #888;
    font-size: 0.9rem;
    margin-top: 24px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .balance {
    font-size: 3rem;
    font-weight: 700;
    margin: 8px 0 32px;
    transition: color 0.2s;
  }

  .balance.positive { color: #22d3ee; }
  .balance.negative { color: #f87171; }
  .balance.zero { color: #fff; }

  .input-row {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 380px;
    margin-bottom: 16px;
  }

  input[type="number"] {
    flex: 1;
    font-size: 1.2rem;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #2a2a2e;
    background: #1c1c20;
    color: #fff;
    text-align: center;
    min-width: 0;
  }

  input[type="number"]:focus {
    outline: none;
    border-color: #555;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 380px;
  }

  button {
    flex: 1;
    font-size: 1.4rem;
    font-weight: 700;
    padding: 18px;
    border: none;
    border-radius: 14px;
    color: #fff;
    cursor: pointer;
  }

  .btn-plus { background: linear-gradient(135deg, #06b6d4, #2563eb); }
  .btn-minus { background: #dc2626; }

  button:active { opacity: 0.7; }

  .history {
    width: 100%;
    max-width: 380px;
    margin-top: 32px;
  }

  .history-title {
    color: #888;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 40vh;
    overflow-y: auto;
  }

  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1c1c20;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.95rem;
  }

  .history-item span.amt.positive { color: #22d3ee; }
  .history-item span.amt.negative { color: #f87171; }

  .history-item button.del {
    background: none;
    border: none;
    color: #555;
    font-size: 1rem;
    padding: 0 0 0 12px;
    flex: none;
  }

  .reset-btn {
    margin-top: 24px;
    background: none;
    color: #555;
    font-size: 0.85rem;
    text-decoration: underline;
    padding: 8px;
  }

  .page {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .page.hidden { display: none; }

  .top-nav {
    display: flex;
    gap: 10px;
    background: #1c1c20;
    padding: 6px;
    border-radius: 999px;
    margin-top: 8px;
  }

  .nav-btn {
    background: none;
    border-radius: 999px;
    padding: 10px 28px;
    font-size: 0.9rem;
    font-weight: 600;
    color: #777;
    flex: none;
  }

  .nav-btn.active {
    color: #fff;
    background: linear-gradient(135deg, #06b6d4, #2563eb);
  }
</style>
</head>
<body>

  <div class="top-nav">
    <button class="nav-btn active" id="navHome">Home</button>
    <button class="nav-btn" id="navTotal">Total</button>
  </div>

  <div class="page" id="homePage">
    <div class="balance-label">Биланс</div>
    <div class="balance zero" id="balance">0</div>

    <div class="input-row">
      <input type="number" id="amountInput" placeholder="Внеси сума" inputmode="decimal">
    </div>

    <div class="btn-row">
      <button class="btn-minus" id="minusBtn">−</button>
      <button class="btn-plus" id="plusBtn">+</button>
    </div>
  </div>

  <div class="page hidden" id="totalPage">
    <div class="history" style="margin-top:24px;">
      <div class="history-title">Историја</div>
      <div class="history-list" id="historyList"></div>
    </div>
    <button class="reset-btn" id="resetBtn">Ресетирај сè</button>
  </div>

<script>
  const balanceEl = document.getElementById('balance');
  const inputEl = document.getElementById('amountInput');
  const historyListEl = document.getElementById('historyList');
  const plusBtn = document.getElementById('plusBtn');
  const minusBtn = document.getElementById('minusBtn');
  const resetBtn = document.getElementById('resetBtn');

  let balance = parseFloat(localStorage.getItem('balance')) || 0;
  let history = JSON.parse(localStorage.getItem('history')) || [];

  function save() {
    localStorage.setItem('balance', balance);
    localStorage.setItem('history', JSON.stringify(history));
  }

  function renderBalance() {
    balanceEl.textContent = (balance >= 0 ? '+' : '') + balance.toFixed(0);
    balanceEl.classList.remove('positive', 'negative', 'zero');
    if (balance > 0) balanceEl.classList.add('positive');
    else if (balance < 0) balanceEl.classList.add('negative');
    else balanceEl.classList.add('zero');
  }

  function renderHistory() {
    historyListEl.innerHTML = '';
    history.slice().reverse().forEach((item) => {
      const realIndex = history.indexOf(item);
      const row = document.createElement('div');
      row.className = 'history-item';

      const amtSpan = document.createElement('span');
      amtSpan.className = 'amt ' + (item.amount >= 0 ? 'positive' : 'negative');
      amtSpan.textContent = (item.amount >= 0 ? '+' : '') + item.amount;

      const dateSpan = document.createElement('span');
      dateSpan.textContent = item.date;
      dateSpan.style.color = '#777';
      dateSpan.style.fontSize = '0.8rem';

      const delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.textContent = '✕';
      delBtn.onclick = () => {
        balance -= item.amount;
        history.splice(realIndex, 1);
        save();
        renderBalance();
        renderHistory();
      };

      row.appendChild(dateSpan);
      row.appendChild(amtSpan);
      row.appendChild(delBtn);
      historyListEl.appendChild(row);
    });
  }

  function addTransaction(sign) {
    const raw = inputEl.value.trim();
    const value = parseFloat(raw);
    if (!raw || isNaN(value) || value <= 0) {
      inputEl.focus();
      return;
    }
    const amount = sign * value;
    balance += amount;

    const now = new Date();
    const dateStr = now.toLocaleDateString('mk-MK', { day: '2-digit', month: '2-digit' }) +
                    ' ' + now.toLocaleTimeString('mk-MK', { hour: '2-digit', minute: '2-digit' });

    history.push({ amount, date: dateStr });
    save();
    renderBalance();
    renderHistory();

    inputEl.value = '';
    inputEl.focus();
  }

  const homePage = document.getElementById('homePage');
  const totalPage = document.getElementById('totalPage');
  const navHome = document.getElementById('navHome');
  const navTotal = document.getElementById('navTotal');

  function showHome() {
    homePage.classList.remove('hidden');
    totalPage.classList.add('hidden');
    navHome.classList.add('active');
    navTotal.classList.remove('active');
  }

  function showTotal() {
    totalPage.classList.remove('hidden');
    homePage.classList.add('hidden');
    navTotal.classList.add('active');
    navHome.classList.remove('active');
    renderHistory();
  }

  navHome.addEventListener('click', showHome);
  navTotal.addEventListener('click', showTotal);

  plusBtn.addEventListener('click', () => addTransaction(1));
  minusBtn.addEventListener('click', () => addTransaction(-1));

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTransaction(1);
  });

  resetBtn.addEventListener('click', () => {
    if (confirm('Дали си сигурен дека сакаш да го ресетираш сè?')) {
      balance = 0;
      history = [];
      save();
      renderBalance();
      renderHistory();
    }
  });

  renderBalance();
  renderHistory();
</script>

</body>
</html>
